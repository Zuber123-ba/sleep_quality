<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile - Sleep Quality Prediction</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#14054e,#5f2c82,#49a09d);
  min-height:100vh;
  padding:30px 10px;
  color:#fff;
}

.container{
  max-width:800px;
  margin:auto;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(18px);
  border-radius:22px;
  padding:40px;
  box-shadow:0 30px 60px rgba(0,0,0,.35);
}

.header{
  text-align:center;
  margin-bottom:40px;
}

h1{
  font-size:32px;
  margin-bottom:10px;
}

.back-btn{
  position:absolute;
  top:20px;
  left:20px;
  background:rgba(255,255,255,.2);
  border:none;
  color:#fff;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
  text-decoration:none;
  font-size:14px;
}

.back-btn:hover{
  background:rgba(255,255,255,.3);
}

.profile-card{
  background:rgba(255,255,255,.2);
  border-radius:18px;
  padding:30px;
  margin-bottom:30px;
}

.profile-info{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.info-item{
  background:rgba(255,255,255,.1);
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.info-label{
  font-size:14px;
  opacity:.8;
  margin-bottom:8px;
}

.info-value{
  font-size:18px;
  font-weight:600;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:20px;
  margin-top:30px;
}

.stat-card{
  background:rgba(255,255,255,.15);
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.stat-number{
  font-size:24px;
  font-weight:700;
  color:#ffd369;
  margin-bottom:5px;
}

.stat-label{
  font-size:12px;
  opacity:.8;
}

.loader{
  width:40px;
  height:40px;
  border:4px solid rgba(255,255,255,.3);
  border-top:4px solid #ffd369;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:20px auto;
}

@keyframes spin{100%{transform:rotate(360deg)}}

@media(max-width:600px){
  .container{
    padding:30px 20px;
  }
  
  .profile-info{
    grid-template-columns:1fr;
  }
  
  .back-btn{
    position:static;
    margin-bottom:20px;
    display:inline-block;
  }
}
</style>
</head>

<body>

<div class="container">
  <a href="dashboard" class="back-btn">← Back to Dashboard</a>
  
  <div class="header">
    <h1>👤 My Profile</h1>
    <p>Your sleep analysis account information</p>
  </div>

  <div id="profileContent" style="display:none;">
    <div class="profile-card">
      <div class="profile-info">
        <div class="info-item">
          <div class="info-label">Full Name</div>
          <div class="info-value" id="fullName">--</div>
        </div>
        
        <div class="info-item">
          <div class="info-label">Email</div>
          <div class="info-value" id="email">--</div>
        </div>
        
        <div class="info-item">
          <div class="info-label">Age</div>
          <div class="info-value" id="age">--</div>
        </div>
        
        <div class="info-item">
          <div class="info-label">Gender</div>
          <div class="info-value" id="gender">--</div>
        </div>
        
        <div class="info-item">
          <div class="info-label">Profession</div>
          <div class="info-value" id="profession">--</div>
        </div>
      </div>
    </div>

    <div class="profile-card">
      <h3>📊 Account Statistics</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="memberSince">--</div>
          <div class="stat-label">Member Since</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-number" id="lastLogin">--</div>
          <div class="stat-label">Last Login</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-number">0</div>
          <div class="stat-label">Sleep Reports</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-number">0</div>
          <div class="stat-label">Predictions Made</div>
        </div>
      </div>
    </div>
  </div>

  <div id="loadingProfile" class="loader"></div>
</div>

<script>
// Authentication check and profile loading
function loadProfile() {
  const token = localStorage.getItem('userToken');
  
  if (!token) {
    window.location.href = 'welcome.html';
    return;
  }

  fetch('http://127.0.0.1:5000/profile', {
    method: 'GET',
    headers: {
      'Authorization': `Bearer ${token}`
    }
  })
  .then(res => {
    if (!res.ok) {
      throw new Error('Failed to load profile');
    }
    return res.json();
  })
  .then(data => {
    const user = data.user;
    
    // Update profile information
    document.getElementById('fullName').textContent = user.name;
    document.getElementById('email').textContent = user.email;
    document.getElementById('age').textContent = user.age + ' years';
    document.getElementById('gender').textContent = user.gender.charAt(0).toUpperCase() + user.gender.slice(1);
    document.getElementById('profession').textContent = formatProfession(user.profession);
    
    // Format dates
    if (user.created_at) {
      const createdDate = new Date(user.created_at);
      document.getElementById('memberSince').textContent = createdDate.toLocaleDateString();
    }
    
    if (user.last_login) {
      const lastLoginDate = new Date(user.last_login);
      document.getElementById('lastLogin').textContent = lastLoginDate.toLocaleDateString();
    } else {
      document.getElementById('lastLogin').textContent = 'First time';
    }
    
    // Show profile content
    document.getElementById('loadingProfile').style.display = 'none';
    document.getElementById('profileContent').style.display = 'block';
  })
  .catch(err => {
    console.error('Profile loading failed:', err);
    localStorage.clear();
    window.location.href = 'welcome.html';
  });
}

// Format profession for display
function formatProfession(profession) {
  const professionMap = {
    'student': 'Student',
    'healthcare-worker': 'Healthcare Worker',
    'teacher-educator': 'Teacher/Educator',
    'engineer-tech': 'Engineer/Tech Professional',
    'business-finance': 'Business/Finance',
    'retail-service': 'Retail/Service Industry',
    'manufacturing': 'Manufacturing',
    'transportation': 'Transportation',
    'government': 'Government Employee',
    'freelancer': 'Freelancer/Self-employed',
    'retired': 'Retired',
    'unemployed': 'Unemployed',
    'shift-worker': 'Shift Worker',
    'remote-worker': 'Remote Worker',
    'other': 'Other'
  };
  
  return professionMap[profession] || profession;
}

// Load profile on page load
loadProfile();
</script>

</body>
</html>
