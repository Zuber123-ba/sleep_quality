<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Register - Sleep Quality Prediction</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* CSS Variables for Consistent Theming */
:root {
  --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #43cea2 75%, #667eea 100%);
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.2);
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.9);
  --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
  --shadow-heavy: 0 25px 50px rgba(0, 0, 0, 0.25);
  --border-radius: 20px;
  --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--primary-gradient);
  background-size: 400% 400%;
  animation: gradientShift 20s ease infinite;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: var(--text-primary);
  position: relative;
  overflow-x: hidden;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  25% { background-position: 100% 50%; }
  50% { background-position: 100% 100%; }
  75% { background-position: 0% 100%; }
  100% { background-position: 0% 50%; }
}

/* Animated Background Elements */
.bg-elements {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
}

.floating-shape {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  animation: float 10s ease-in-out infinite;
}

.shape-1 {
  width: 120px;
  height: 120px;
  top: 10%;
  left: 5%;
  animation-delay: 0s;
}

.shape-2 {
  width: 80px;
  height: 80px;
  top: 60%;
  right: 5%;
  animation-delay: 4s;
}

.shape-3 {
  width: 100px;
  height: 100px;
  bottom: 10%;
  left: 10%;
  animation-delay: 8s;
}

.shape-4 {
  width: 60px;
  height: 60px;
  top: 30%;
  right: 20%;
  animation-delay: 2s;
}

@keyframes float {
  0%, 100% { 
    transform: translateY(0px) rotate(0deg);
    opacity: 0.3;
  }
  50% { 
    transform: translateY(-40px) rotate(180deg);
    opacity: 0.7;
  }
}

/* Back Button */
.back-btn {
  position: absolute;
  top: 30px;
  left: 30px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  color: var(--text-primary);
  padding: 12px 16px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 500;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  z-index: 100;
}

.back-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: translateX(-5px);
  box-shadow: var(--shadow-light);
}

/* Auth Container */
.auth-container {
  max-width: 520px;
  width: 100%;
  background: var(--glass-bg);
  backdrop-filter: blur(30px);
  border-radius: 30px;
  padding: 50px 40px;
  box-shadow: var(--shadow-heavy);
  text-align: center;
  border: 1px solid var(--glass-border);
  animation: slideUp 0.8s ease-out;
  position: relative;
  overflow: hidden;
  margin: 20px auto;
}

.auth-container::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
  animation: shimmer 4s ease-in-out infinite;
  pointer-events: none;
}

@keyframes shimmer {
  0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
  100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Header */
.auth-header {
  margin-bottom: 35px;
}

.auth-icon {
  font-size: 70px;
  margin-bottom: 20px;
  display: inline-block;
  animation: iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(5deg); }
}

h1 {
  font-size: 32px;
  margin-bottom: 15px;
  background: linear-gradient(135deg, #ffd89b, #19547b, #667eea);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
  line-height: 1.2;
}

.subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  margin-bottom: 35px;
  font-weight: 400;
  line-height: 1.5;
}

/* Form Styles */
.form-group {
  margin-bottom: 20px;
  text-align: left;
  position: relative;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
  font-size: 14px;
  color: var(--text-secondary);
}

.input-wrapper {
  position: relative;
}

.input-wrapper i {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  font-size: 14px;
  z-index: 1;
}

input[type="text"], 
input[type="email"], 
input[type="password"], 
input[type="number"], 
select {
  width: 100%;
  padding: 16px 18px;
  border: 2px solid var(--glass-border);
  border-radius: var(--border-radius);
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  color: var(--text-primary);
  font-size: 15px;
  font-family: 'Poppins', sans-serif;
  transition: var(--transition);
}

.input-wrapper input {
  padding-left: 45px;
}

input::placeholder {
  color: rgba(255, 255, 255, 0.6);
}

input:focus, 
select:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.5);
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
  transform: translateY(-2px);
}

select {
  cursor: pointer;
}

select option {
  background: #2c3e50;
  color: #fff;
}

/* Password Strength Indicator */
.password-strength {
  margin-top: 8px;
  font-size: 12px;
  font-weight: 500;
  transition: var(--transition);
}

.strength-weak { color: #ff6b6b; }
.strength-medium { color: #ffd43b; }
.strength-strong { color: #51cf66; }

/* Button Styles */
.btn {
  width: 100%;
  padding: 20px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: var(--text-primary);
  font-weight: 600;
  font-size: 18px;
  cursor: pointer;
  transition: var(--transition);
  margin-top: 25px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
  font-family: 'Poppins', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.6s ease;
}

.btn:hover::before {
  left: 100%;
}

.btn:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 20px 40px rgba(102, 126, 234, 0.5);
}

.btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

/* Loading Spinner */
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top: 2px solid var(--text-primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  display: none;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* Auth Links */
.auth-links {
  margin-top: 25px;
  font-size: 15px;
}

.auth-links a {
  color: var(--text-primary);
  text-decoration: none;
  font-weight: 500;
  transition: var(--transition);
  position: relative;
}

.auth-links a::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(45deg, #667eea, #764ba2);
  transition: width 0.3s ease;
}

.auth-links a:hover::after {
  width: 100%;
}

.auth-links a:hover {
  color: #fff;
}

/* Alert Messages */
.alert {
  padding: 15px 20px;
  border-radius: var(--border-radius);
  margin-bottom: 20px;
  font-size: 14px;
  font-weight: 500;
  display: none;
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.alert.error {
  background: rgba(255, 107, 107, 0.2);
  color: #ff6b6b;
  border: 1px solid rgba(255, 107, 107, 0.3);
}

.alert.success {
  background: rgba(67, 206, 162, 0.2);
  color: #43cea2;
  border: 1px solid rgba(67, 206, 162, 0.3);
}

/* Progress Steps */
.progress-steps {
  display: flex;
  justify-content: center;
  margin-bottom: 30px;
  gap: 15px;
}

.step {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transition: var(--transition);
}

.step.active {
  background: linear-gradient(45deg, #667eea, #764ba2);
  box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
}

/* Responsive Design */
@media (max-width: 768px) {
  .back-btn {
    top: 20px;
    left: 20px;
    padding: 10px 14px;
    font-size: 13px;
  }
  
  .auth-container {
    padding: 40px 25px;
    margin: 15px;
  }
  
  .form-row {
    grid-template-columns: 1fr;
    gap: 15px;
  }
  
  h1 {
    font-size: 26px;
  }
  
  .subtitle {
    font-size: 15px;
  }
  
  .auth-icon {
    font-size: 55px;
  }
}

@media (max-width: 480px) {
  .auth-container {
    padding: 30px 20px;
  }
  
  h1 {
    font-size: 24px;
  }
  
  input[type="text"], 
  input[type="email"], 
  input[type="password"], 
  input[type="number"], 
  select {
    padding: 14px 16px;
    font-size: 14px;
  }
  
  .input-wrapper input {
    padding-left: 40px;
  }
  
  .btn {
    padding: 18px;
    font-size: 16px;
  }
}

/* Enhanced Visual Effects */
.auth-container:hover {
  box-shadow: 
    0 35px 70px rgba(0, 0, 0, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

/* Validation States */
.form-group.valid input {
  border-color: rgba(67, 206, 162, 0.5);
  background: rgba(67, 206, 162, 0.1);
}

.form-group.invalid input {
  border-color: rgba(255, 107, 107, 0.5);
  background: rgba(255, 107, 107, 0.1);
}

/* Password Toggle */
.password-toggle {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  transition: var(--transition);
}

.password-toggle:hover {
  color: var(--text-primary);
}
</style>
</head>

<body>
<!-- Animated Background Elements -->
<div class="bg-elements">
  <div class="floating-shape shape-1"></div>
  <div class="floating-shape shape-2"></div>
  <div class="floating-shape shape-3"></div>
  <div class="floating-shape shape-4"></div>
</div>

<!-- Back Button -->
<a href="welcome.html" class="back-btn">
  <i class="fas fa-arrow-left"></i>
  Back to Home
</a>

<div class="auth-container">
  <div class="auth-header">
    <div class="auth-icon">
      <i class="fas fa-user-plus"></i>
    </div>
    <h1>Join SleepAI</h1>
    <p class="subtitle">Create your personalized sleep analysis account and start your journey to better sleep</p>
  </div>

  <!-- Progress Steps -->
  <div class="progress-steps">
    <div class="step active"></div>
    <div class="step"></div>
    <div class="step"></div>
  </div>

  <div id="errorMsg" class="alert error"></div>
  <div id="successMsg" class="alert success"></div>

  <form id="registerForm">
    <div class="form-row">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required>
        </div>
      </div>
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <div class="input-wrapper">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="age">Age</label>
        <div class="input-wrapper">
          <i class="fas fa-calendar-alt"></i>
          <input type="number" id="age" name="age" placeholder="Age" min="13" max="120" required>
        </div>
      </div>
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="profession">Profession</label>
      <select id="profession" name="profession" required>
        <option value="">Select Your Profession</option>
        <option value="student">Student</option>
        <option value="healthcare-worker">Healthcare Worker</option>
        <option value="teacher-educator">Teacher/Educator</option>
        <option value="engineer-tech">Engineer/Tech Professional</option>
        <option value="business-finance">Business/Finance</option>
        <option value="retail-service">Retail/Service Industry</option>
        <option value="manufacturing">Manufacturing</option>
        <option value="transportation">Transportation</option>
        <option value="government">Government Employee</option>
        <option value="freelancer">Freelancer/Self-employed</option>
        <option value="retired">Retired</option>
        <option value="unemployed">Unemployed</option>
        <option value="shift-worker">Shift Worker</option>
        <option value="remote-worker">Remote Worker</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Create password" required minlength="6">
        <button type="button" class="password-toggle" id="passwordToggle">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <div id="passwordStrength" class="password-strength"></div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <div class="input-wrapper">
        <i class="fas fa-lock"></i>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
        <button type="button" class="password-toggle" id="confirmPasswordToggle">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn" id="registerBtn">
      <span id="registerText">
        <i class="fas fa-user-plus"></i>
        Create Account
      </span>
      <div id="registerSpinner" class="spinner"></div>
    </button>
  </form>

  <div class="auth-links">
    <p>Already have an account? <a href="login.html">Sign in here</a></p>
  </div>
</div>

<script>
// DOM Elements
const registerForm = document.getElementById('registerForm');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
const registerText = document.getElementById('registerText');
const registerSpinner = document.getElementById('registerSpinner');
const registerBtn = document.getElementById('registerBtn');
const passwordInput = document.getElementById('password');
const passwordStrength = document.getElementById('passwordStrength');
const confirmPasswordInput = document.getElementById('confirmPassword');
const passwordToggle = document.getElementById('passwordToggle');
const confirmPasswordToggle = document.getElementById('confirmPasswordToggle');

// Password Toggle Functionality
passwordToggle.addEventListener('click', () => {
  const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
  passwordInput.setAttribute('type', type);
  
  const icon = passwordToggle.querySelector('i');
  icon.classList.toggle('fa-eye');
  icon.classList.toggle('fa-eye-slash');
});

confirmPasswordToggle.addEventListener('click', () => {
  const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
  confirmPasswordInput.setAttribute('type', type);
  
  const icon = confirmPasswordToggle.querySelector('i');
  icon.classList.toggle('fa-eye');
  icon.classList.toggle('fa-eye-slash');
});

// Password Strength Checker
passwordInput.addEventListener('input', () => {
  const password = passwordInput.value;
  const strength = checkPasswordStrength(password);
  
  passwordStrength.textContent = strength.text;
  passwordStrength.className = `password-strength ${strength.class}`;
  
  // Update progress steps
  updateProgressSteps();
});

function checkPasswordStrength(password) {
  if (password.length < 6) {
    return { text: 'Password too short (minimum 6 characters)', class: 'strength-weak' };
  }
  
  let score = 0;
  if (password.length >= 8) score++;
  if (/[A-Z]/.test(password)) score++;
  if (/[a-z]/.test(password)) score++;
  if (/[0-9]/.test(password)) score++;
  if (/[^A-Za-z0-9]/.test(password)) score++;
  
  if (score < 3) {
    return { text: 'Weak password - add uppercase, numbers, or symbols', class: 'strength-weak' };
  } else if (score < 4) {
    return { text: 'Medium strength password', class: 'strength-medium' };
  } else {
    return { text: 'Strong password âœ“', class: 'strength-strong' };
  }
}

// Confirm Password Validation
confirmPasswordInput.addEventListener('input', () => {
  const formGroup = confirmPasswordInput.closest('.form-group');
  
  if (confirmPasswordInput.value && passwordInput.value !== confirmPasswordInput.value) {
    confirmPasswordInput.setCustomValidity('Passwords do not match');
    formGroup.classList.add('invalid');
    formGroup.classList.remove('valid');
  } else {
    confirmPasswordInput.setCustomValidity('');
    formGroup.classList.remove('invalid');
    if (confirmPasswordInput.value) {
      formGroup.classList.add('valid');
    }
  }
  
  updateProgressSteps();
});

// Progress Steps Update
function updateProgressSteps() {
  const steps = document.querySelectorAll('.step');
  const firstName = document.getElementById('firstName').value;
  const lastName = document.getElementById('lastName').value;
  const email = document.getElementById('email').value;
  const password = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;
  
  // Step 1: Basic info
  if (firstName && lastName && email) {
    steps[1].classList.add('active');
  } else {
    steps[1].classList.remove('active');
  }
  
  // Step 2: Password
  if (password && confirmPassword && password === confirmPassword) {
    steps[2].classList.add('active');
  } else {
    steps[2].classList.remove('active');
  }
}

// Form Validation
document.querySelectorAll('input, select').forEach(input => {
  input.addEventListener('input', () => {
    const formGroup = input.closest('.form-group');
    
    if (input.checkValidity() && input.value) {
      formGroup.classList.add('valid');
      formGroup.classList.remove('invalid');
    } else if (input.value) {
      formGroup.classList.add('invalid');
      formGroup.classList.remove('valid');
    } else {
      formGroup.classList.remove('valid', 'invalid');
    }
    
    updateProgressSteps();
  });
});

// Form Submission
registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = new FormData(registerForm);
  const userData = Object.fromEntries(formData);

  // Validate passwords match
  if (userData.password !== userData.confirmPassword) {
    showError('Passwords do not match');
    return;
  }

  // Show loading state
  registerBtn.disabled = true;
  registerText.style.display = 'none';
  registerSpinner.style.display = 'block';
  hideAlerts();

  try {
    const response = await fetch('/register', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        firstName: userData.firstName,
        lastName: userData.lastName,
        email: userData.email,
        age: parseInt(userData.age),
        gender: userData.gender,
        profession: userData.profession,
        password: userData.password
      })
    });

    const data = await response.json();

    if (response.ok) {
      showSuccess('Account created successfully! Redirecting to login...');
      
      // Redirect to login page
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    } else {
      showError(data.error || 'Registration failed. Please check your information and try again.');
    }
  } catch (error) {
    showError('Network error. Please check your connection and try again.');
  } finally {
    // Reset loading state
    registerBtn.disabled = false;
    registerText.style.display = 'flex';
    registerSpinner.style.display = 'none';
  }
});

// Alert Functions
function showError(message) {
  errorMsg.textContent = message;
  errorMsg.style.display = 'block';
  successMsg.style.display = 'none';
}

function showSuccess(message) {
  successMsg.textContent = message;
  successMsg.style.display = 'block';
  errorMsg.style.display = 'none';
}

function hideAlerts() {
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
}

// Check if user is already logged in
if (localStorage.getItem('userToken')) {
  window.location.href = 'dashboard';
}

// Enhanced Input Focus Effects
document.querySelectorAll('input, select').forEach(input => {
  input.addEventListener('focus', function() {
    this.closest('.input-wrapper, .form-group').style.transform = 'translateY(-2px)';
  });
  
  input.addEventListener('blur', function() {
    this.closest('.input-wrapper, .form-group').style.transform = 'translateY(0)';
  });
});

// Dynamic Background Animation
let gradientAngle = 0;
setInterval(() => {
  gradientAngle += 0.5;
  document.body.style.backgroundImage = `
    linear-gradient(${gradientAngle}deg, 
      #667eea 0%, 
      #764ba2 25%, 
      #f093fb 50%, 
      #43cea2 75%, 
      #667eea 100%
    )`;
}, 100);
</script>

</body>
</html>
