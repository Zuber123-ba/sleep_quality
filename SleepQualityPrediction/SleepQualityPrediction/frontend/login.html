<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Login - Sleep Quality Prediction</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* CSS Variables for Consistent Theming */
:root {
  --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #43cea2 75%, #667eea 100%);
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.2);
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.9);
  --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
  --shadow-heavy: 0 25px 50px rgba(0, 0, 0, 0.25);
  --border-radius: 20px;
  --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--primary-gradient);
  background-size: 400% 400%;
  animation: gradientShift 20s ease infinite;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: var(--text-primary);
  position: relative;
  overflow: hidden;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  25% { background-position: 100% 50%; }
  50% { background-position: 100% 100%; }
  75% { background-position: 0% 100%; }
  100% { background-position: 0% 50%; }
}

/* Animated Background Elements */
.bg-elements {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
}

.floating-shape {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  animation: float 8s ease-in-out infinite;
}

.shape-1 {
  width: 100px;
  height: 100px;
  top: 15%;
  left: 10%;
  animation-delay: 0s;
}

.shape-2 {
  width: 150px;
  height: 150px;
  top: 70%;
  right: 10%;
  animation-delay: 3s;
}

.shape-3 {
  width: 80px;
  height: 80px;
  bottom: 15%;
  left: 15%;
  animation-delay: 6s;
}

@keyframes float {
  0%, 100% { 
    transform: translateY(0px) rotate(0deg);
    opacity: 0.3;
  }
  50% { 
    transform: translateY(-30px) rotate(180deg);
    opacity: 0.7;
  }
}

/* Back Button */
.back-btn {
  position: absolute;
  top: 30px;
  left: 30px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  color: var(--text-primary);
  padding: 12px 16px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 500;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

.back-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: translateX(-5px);
  box-shadow: var(--shadow-light);
}

/* Auth Container */
.auth-container {
  max-width: 480px;
  width: 100%;
  background: var(--glass-bg);
  backdrop-filter: blur(30px);
  border-radius: 30px;
  padding: 60px 50px;
  box-shadow: var(--shadow-heavy);
  text-align: center;
  border: 1px solid var(--glass-border);
  animation: slideUp 0.8s ease-out;
  position: relative;
  overflow: hidden;
}

.auth-container::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
  animation: shimmer 4s ease-in-out infinite;
  pointer-events: none;
}

@keyframes shimmer {
  0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
  100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Header */
.auth-header {
  margin-bottom: 40px;
}

.auth-icon {
  font-size: 80px;
  margin-bottom: 20px;
  display: inline-block;
  animation: iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(5deg); }
}

h1 {
  font-size: 36px;
  margin-bottom: 15px;
  background: linear-gradient(135deg, #ffd89b, #19547b, #667eea);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
  line-height: 1.2;
}

.subtitle {
  font-size: 18px;
  color: var(--text-secondary);
  margin-bottom: 40px;
  font-weight: 400;
  line-height: 1.5;
}

/* Form Styles */
.form-group {
  margin-bottom: 25px;
  text-align: left;
  position: relative;
}

.form-group label {
  display: block;
  margin-bottom: 10px;
  font-weight: 500;
  font-size: 15px;
  color: var(--text-secondary);
}

.input-wrapper {
  position: relative;
}

.input-wrapper i {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  font-size: 16px;
  z-index: 1;
}

input[type="email"], 
input[type="password"] {
  width: 100%;
  padding: 18px 20px 18px 50px;
  border: 2px solid var(--glass-border);
  border-radius: var(--border-radius);
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  color: var(--text-primary);
  font-size: 16px;
  font-family: 'Poppins', sans-serif;
  transition: var(--transition);
}

input[type="email"]::placeholder, 
input[type="password"]::placeholder {
  color: rgba(255, 255, 255, 0.6);
}

input[type="email"]:focus, 
input[type="password"]:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.5);
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
  transform: translateY(-2px);
}

/* Button Styles */
.btn {
  width: 100%;
  padding: 20px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: var(--text-primary);
  font-weight: 600;
  font-size: 18px;
  cursor: pointer;
  transition: var(--transition);
  margin-top: 30px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
  font-family: 'Poppins', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.6s ease;
}

.btn:hover::before {
  left: 100%;
}

.btn:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 20px 40px rgba(102, 126, 234, 0.5);
}

.btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

/* Loading Spinner */
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top: 2px solid var(--text-primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  display: none;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* Auth Links */
.auth-links {
  margin-top: 30px;
  font-size: 15px;
}

.auth-links p {
  margin-bottom: 10px;
}

.auth-links a {
  color: var(--text-primary);
  text-decoration: none;
  font-weight: 500;
  transition: var(--transition);
  position: relative;
}

.auth-links a::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(45deg, #667eea, #764ba2);
  transition: width 0.3s ease;
}

.auth-links a:hover::after {
  width: 100%;
}

.auth-links a:hover {
  color: #fff;
}

/* Alert Messages */
.alert {
  padding: 15px 20px;
  border-radius: var(--border-radius);
  margin-bottom: 25px;
  font-size: 14px;
  font-weight: 500;
  display: none;
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.alert.error {
  background: rgba(255, 107, 107, 0.2);
  color: #ff6b6b;
  border: 1px solid rgba(255, 107, 107, 0.3);
}

.alert.success {
  background: rgba(67, 206, 162, 0.2);
  color: #43cea2;
  border: 1px solid rgba(67, 206, 162, 0.3);
}

/* Responsive Design */
@media (max-width: 768px) {
  .back-btn {
    top: 20px;
    left: 20px;
    padding: 10px 14px;
    font-size: 13px;
  }
  
  .auth-container {
    padding: 40px 30px;
    margin: 20px;
  }
  
  h1 {
    font-size: 28px;
  }
  
  .subtitle {
    font-size: 16px;
  }
  
  .auth-icon {
    font-size: 60px;
  }
}

@media (max-width: 480px) {
  .auth-container {
    padding: 30px 20px;
  }
  
  h1 {
    font-size: 24px;
  }
  
  input[type="email"], 
  input[type="password"] {
    padding: 16px 18px 16px 45px;
    font-size: 15px;
  }
  
  .btn {
    padding: 18px;
    font-size: 16px;
  }
}

/* Enhanced Visual Effects */
.auth-container:hover {
  box-shadow: 
    0 35px 70px rgba(0, 0, 0, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

/* Focus States */
input:focus + .input-icon {
  color: var(--text-primary);
}

/* Password Toggle */
.password-toggle {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 16px;
  transition: var(--transition);
}

.password-toggle:hover {
  color: var(--text-primary);
}
</style>
</head>

<body>
<!-- Animated Background Elements -->
<div class="bg-elements">
  <div class="floating-shape shape-1"></div>
  <div class="floating-shape shape-2"></div>
  <div class="floating-shape shape-3"></div>
</div>

<!-- Back Button -->
<a href="welcome.html" class="back-btn">
  <i class="fas fa-arrow-left"></i>
  Back to Home
</a>

<div class="auth-container">
  <div class="auth-header">
    <div class="auth-icon">
      <i class="fas fa-moon"></i>
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your sleep analysis account and continue your journey to better sleep</p>
  </div>

  <div id="errorMsg" class="alert error"></div>
  <div id="successMsg" class="alert success"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email Address</label>
      <div class="input-wrapper">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <button type="button" class="password-toggle" id="passwordToggle">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn" id="loginBtn">
      <span id="loginText">
        <i class="fas fa-sign-in-alt"></i>
        Sign In
      </span>
      <div id="loginSpinner" class="spinner"></div>
    </button>
  </form>

  <div class="auth-links">
    <p>Don't have an account? <a href="register.html">Create one here</a></p>
    <p><a href="#" id="forgotPassword">Forgot your password?</a></p>
  </div>
</div>

<script>
// DOM Elements
const loginForm = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
const loginText = document.getElementById('loginText');
const loginSpinner = document.getElementById('loginSpinner');
const loginBtn = document.getElementById('loginBtn');
const passwordToggle = document.getElementById('passwordToggle');
const passwordInput = document.getElementById('password');

// Password Toggle Functionality
passwordToggle.addEventListener('click', () => {
  const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
  passwordInput.setAttribute('type', type);
  
  const icon = passwordToggle.querySelector('i');
  icon.classList.toggle('fa-eye');
  icon.classList.toggle('fa-eye-slash');
});

// Form Submission
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  // Show loading state
  loginBtn.disabled = true;
  loginText.style.display = 'none';
  loginSpinner.style.display = 'block';
  hideAlerts();

  try {
    const response = await fetch('http://127.0.0.1:5000/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (response.ok) {
      // Store user session
      localStorage.setItem('userToken', data.token);
      localStorage.setItem('userName', data.user.name);
      localStorage.setItem('userEmail', data.user.email);
      
      showSuccess('Login successful! Redirecting to dashboard...');
      
      // Redirect to main dashboard
      setTimeout(() => {
        window.location.href = 'dashboard';
      }, 1500);
    } else {
      showError(data.error || 'Login failed. Please check your credentials and try again.');
    }
  } catch (error) {
    showError('Network error. Please check your connection and try again.');
  } finally {
    // Reset loading state
    loginBtn.disabled = false;
    loginText.style.display = 'flex';
    loginSpinner.style.display = 'none';
  }
});

// Alert Functions
function showError(message) {
  errorMsg.textContent = message;
  errorMsg.style.display = 'block';
  successMsg.style.display = 'none';
}

function showSuccess(message) {
  successMsg.textContent = message;
  successMsg.style.display = 'block';
  errorMsg.style.display = 'none';
}

function hideAlerts() {
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
}

// Forgot Password Handler
document.getElementById('forgotPassword').addEventListener('click', (e) => {
  e.preventDefault();
  showError('Password reset functionality will be implemented soon! Please contact support if needed.');
});

// Check if user is already logged in
if (localStorage.getItem('userToken')) {
  window.location.href = 'dashboard';
}

// Enhanced Input Focus Effects
document.querySelectorAll('input').forEach(input => {
  input.addEventListener('focus', function() {
    this.parentElement.style.transform = 'translateY(-2px)';
  });
  
  input.addEventListener('blur', function() {
    this.parentElement.style.transform = 'translateY(0)';
  });
});

// Dynamic Background Animation
let gradientAngle = 0;
setInterval(() => {
  gradientAngle += 0.5;
  document.body.style.backgroundImage = `
    linear-gradient(${gradientAngle}deg, 
      #667eea 0%, 
      #764ba2 25%, 
      #f093fb 50%, 
      #43cea2 75%, 
      #667eea 100%
    )`;
}, 100);
</script>

</body>
</html>
